<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The requested page could not be found. Return to ORBIT SEO Consulting or explore our SEO services.">
  <title>Page Not Found — ORBIT SEO Consulting</title>
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="service-pages.css">
  <link rel="stylesheet" href="cookie-consent.css">
  <style>
    .not-found{min-height:100svh;padding:112px clamp(22px,5vw,76px) 48px;display:flex;flex-direction:column;background:#050504;color:#f0ede4;overflow:hidden}.not-found__top{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.16em}.not-found h1{margin:auto 0 0;font:850 clamp(112px,28vw,410px)/.68 "Archivo",Arial,sans-serif;letter-spacing:-.085em;color:#d8ff00}.not-found__lower{display:grid;grid-template-columns:1fr minmax(280px,.55fr);gap:60px;align-items:end;margin-top:70px;padding-top:28px;border-top:1px solid rgba(240,237,228,.3)}.not-found__lower h2{margin:0;max-width:12ch;font:760 clamp(38px,5vw,76px)/.9 "Archivo",Arial,sans-serif;letter-spacing:-.055em}.not-found__action p{margin:0 0 28px;color:rgba(240,237,228,.65);font-size:15px;line-height:1.65}.not-found__action a{display:inline-flex;gap:18px;align-items:center;min-height:52px;padding:0 20px;border:1px solid #d8ff00;color:#d8ff00;font-size:11px;letter-spacing:.1em;text-decoration:none}.not-found__action a:hover,.not-found__action a:focus-visible{background:#d8ff00;color:#050504}@media(max-width:700px){.not-found{padding:88px 18px 34px}.not-found__top{font-size:8px}.not-found h1{font-size:46vw}.not-found__lower{display:block;margin-top:54px}.not-found__lower h2{font-size:48px}.not-found__action{margin-top:40px}.not-found__action p{font-size:15px}}
  </style>
</head>
<body class="not-found-page">
  <main class="not-found" id="main">
    <div class="not-found__top"><span data-config="brandName">ORBIT</span><span>REQUEST / NOT FOUND</span></div>
    <h1 aria-label="Error 404">404</h1>
    <div class="not-found__lower">
      <h2>THIS PAGE LEFT THE INDEX.</h2>
      <div class="not-found__action"><p>The address may have changed or the page may no longer exist. Return to the search system and continue from a known signal.</p><a href="index.html"><span>RETURN TO ORBIT</span><span aria-hidden="true">↗</span></a></div>
    </div>
  </main>
  <script src="assets/js/lucide.min.js"></script>
  <script src="config/config.js"></script>
  <script src="service-pages.js"></script>
  <script src="cookie-consent.js"></script>
</body>
</html>
